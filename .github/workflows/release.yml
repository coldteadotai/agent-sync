name: release

# The release path: a pushed v* tag publishes via npm Trusted Publishing
# (OIDC, needs npm >= 11.5.1) with provenance attestation. No long-lived npm
# token exists anywhere; until the Trusted Publisher is configured on the
# npm side, a pushed tag fails closed at authentication because the publish
# step carries no credentials at all.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact
          rm -f gitleaks gitleaks.tar.gz
      - name: source stays diffable text
        run: |
          bad=0
          while IFS= read -r file; do
            if ! perl -0777 -ne 'exit 1 if /[\x00-\x08\x0B\x0C\x0E-\x1F]/' "$file"; then
              echo "control bytes in $file" >&2
              bad=1
            fi
          done < <(git ls-files -- src bin test build.mjs .github)
          exit "$bad"
      - name: npm with OIDC trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
